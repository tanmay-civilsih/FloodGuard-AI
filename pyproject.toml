[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "floodguard-ai"
version = "0.1.0"
description = "FloodGuard-AI urban flood digital twin and nowcasting platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==9.0.2",
  "ruff==0.12.10",
]

[tool.setuptools.packages.find]
include = ["floodguard*", "apps*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
