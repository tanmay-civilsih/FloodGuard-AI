[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "floodguard-ai"
version = "0.9.0"
description = "FloodGuard-AI urban flood digital twin and nowcasting platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.128.2",
  "minio==7.2.20",
  "numpy==2.5.2",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pypdf==6.10.0",
  "pyproj==3.7.2",
  "shapely==2.1.2",
  "SQLAlchemy==2.0.52",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==9.0.2",
  "ruff==0.12.10",
]

[tool.setuptools.packages.find]
include = ["floodguard*", "apps*"]

[tool.setuptools.package-data]
"floodguard.reconstruction" = ["calibrations/*.json"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/api/routers/*.py" = ["B008"]
"floodguard/registry/seed.py" = ["E501"]
"floodguard/spatial/qa_viewer.py" = ["E501"]
"floodguard/reconstruction/qa_viewer.py" = ["E501"]
"floodguard/terrain/qa_viewer.py" = ["E501"]
"floodguard/urban_gis/qa_viewer.py" = ["E501"]
"floodguard/drainage/qa_viewer.py" = ["E501"]
"floodguard/twin/qa_viewer.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
