services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floodguard}
      POSTGRES_USER: ${POSTGRES_USER:-floodguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floodguard_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodguard} -d ${POSTGRES_DB:-floodguard}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nats_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-floodguard}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-floodguard_dev_only}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  traefik:
    image: traefik:v3.3
    command:
      - "--api.insecure=false"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build:
      context: .
    environment:
      FLOODGUARD_ENVIRONMENT: ${FLOODGUARD_ENVIRONMENT:-development}
      FLOODGUARD_OPERATORS_JSON: ${FLOODGUARD_OPERATORS_JSON:-}
      FLOODGUARD_LOG_LEVEL: ${FLOODGUARD_LOG_LEVEL:-INFO}
      FLOODGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-floodguard}:${POSTGRES_PASSWORD:-floodguard_dev_only}@postgres:5432/${POSTGRES_DB:-floodguard}
      FLOODGUARD_OBJECT_STORE_ENDPOINT: minio:9000
      FLOODGUARD_OBJECT_STORE_ACCESS_KEY: ${MINIO_ACCESS_KEY:-floodguard}
      FLOODGUARD_OBJECT_STORE_SECRET_KEY: ${MINIO_SECRET_KEY:-floodguard_dev_only}
      FLOODGUARD_OBJECT_STORE_SECURE: "false"
      FLOODGUARD_RAW_BUCKET: ${FLOODGUARD_RAW_BUCKET:-floodguard-raw}
      FLOODGUARD_SPATIAL_BUCKET: ${FLOODGUARD_SPATIAL_BUCKET:-floodguard-spatial}
      FLOODGUARD_HARVEST_MAX_OBJECT_BYTES: ${FLOODGUARD_HARVEST_MAX_OBJECT_BYTES:-134217728}
      FLOODGUARD_HARVEST_MAX_TOTAL_BYTES: ${FLOODGUARD_HARVEST_MAX_TOTAL_BYTES:-805306368}
      FLOODGUARD_HARVEST_MAX_RESOURCES_PER_SOURCE: ${FLOODGUARD_HARVEST_MAX_RESOURCES_PER_SOURCE:-250}
      FLOODGUARD_HARVEST_TIMEOUT_SECONDS: ${FLOODGUARD_HARVEST_TIMEOUT_SECONDS:-60}
      FLOODGUARD_WORKING_CRS: ${FLOODGUARD_WORKING_CRS:-EPSG:32645}
      FLOODGUARD_SPATIAL_ALIGNMENT_TOLERANCE_M: ${FLOODGUARD_SPATIAL_ALIGNMENT_TOLERANCE_M:-0.05}
      FLOODGUARD_RAINFALL_CONSERVATION_TOLERANCE: ${FLOODGUARD_RAINFALL_CONSERVATION_TOLERANCE:-0.000000001}
      FLOODGUARD_SPATIAL_MAX_OBJECT_BYTES: ${FLOODGUARD_SPATIAL_MAX_OBJECT_BYTES:-134217728}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      COPERNICUS_ACCESS_TOKEN: ${COPERNICUS_ACCESS_TOKEN:-}
      IMD_RADAR_TOKEN: ${IMD_RADAR_TOKEN:-}
      KMC_SCADA_TOKEN: ${KMC_SCADA_TOKEN:-}
      KMC_DRAIN_SENSOR_TOKEN: ${KMC_DRAIN_SENSOR_TOKEN:-}
    # Only the API is published to the host. Database, cache, messaging, object store,
    # and proxy stay on the private Compose network so host services cannot collide
    # with FloodGuard's internal ports. Use docker compose exec for infrastructure QA.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.floodguard.rule=PathPrefix(`/`)"
      - "traefik.http.routers.floodguard.entrypoints=web"
      - "traefik.http.services.floodguard.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
